// Continuación del backend eCommerce NestJS - Confirmación por email y vista de historial

// Paso 5: Agregar Nodemailer para enviar confirmación de orden

// src/mail/mail.service.ts
@Injectable()
export class MailService {
  private transporter = nodemailer.createTransport({
    service: 'gmail',
    auth: {
      user: process.env.MAIL_USER,
      pass: process.env.MAIL_PASS,
    },
  });

  async sendOrderConfirmation(to: string, orderId: number) {
    await this.transporter.sendMail({
      from: process.env.MAIL_USER,
      to,
      subject: 'Confirmación de pedido',
      html: `<h1>¡Gracias por tu compra!</h1><p>Tu número de pedido es <b>#${orderId}</b>.</p>`
    });
  }
}

// Llamada desde el CartController
await this.mailService.sendOrderConfirmation(user.email, order.id);

